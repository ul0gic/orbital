version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - errorlint
    - exhaustive
    - forbidigo
    - gocritic
    - godox
    - gosec
    - intrange
    - misspell
    - nilerr
    - noctx
    - perfsprint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
  settings:
    godox:
      keywords:
        - TODO
        - FIXME
        - HACK
        - XXX
        - BUG
        - NOTE
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: terminal output goes through internal/ui only — stdout is reserved for the share URL (pipe-safety)
        - pattern: ^print(ln)?$
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
    exhaustive:
      default-signifies-exhaustive: true
    revive:
      rules:
        - name: package-comments
          disabled: true
        - name: exported
          disabled: true
  exclusions:
    rules:
      - path: internal/ui/
        linters:
          - forbidigo
      - path: cmd/
        linters:
          - forbidigo
      - path: _test\.go
        linters:
          - gosec
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
